id: dev.lostartefacts.TRX
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
command: /app/TRX
finish-args:
  - --device=dri
  - --filesystem=home
  - --socket=x11
